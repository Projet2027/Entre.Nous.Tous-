<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion du site – EntreNousTous</title>

    <style>
        body {
            margin: 0;
            font-family: Poppins, Arial, sans-serif;
            background: radial-gradient(circle at top, #ff4da6 0%, #5a00a0 40%, #0a0a0a 80%);
            color: #fff;
        }

        .header {
            text-align: center;
            padding: 40px 0 20px 0;
        }

        .header h1 {
            font-size: 3rem;
            margin: 0;
            text-shadow: 0 0 15px #ff4da6, 0 0 25px #ff7b00;
            letter-spacing: 2px;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            background: rgba(10,10,10,0.85);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(255,77,166,0.3);
        }

        h2 {
            text-shadow: 0 0 10px #ff7b00;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin: 12px 0;
            font-size: 1.1rem;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 12px;
            margin-top: 6px;
            border-radius: 6px;
            border: none;
            background: #1a1a1a;
            color: #fff;
        }

        .btn {
            display: inline-block;
            padding: 15px 30px;
            margin-top: 25px;
            background: linear-gradient(90deg, #ff4da6, #ff7b00);
            color: #000;
            font-weight: bold;
            border-radius: 8px;
            text-decoration: none;
            font-size: 1.2rem;
            box-shadow: 0 0 15px rgba(255,77,166,0.5);
        }
    </style>
</head>

<body>

    <!-- PROTECTION ADMIN -->
    <script>
        if (localStorage.getItem("admin") !== "true") {
            window.location.href = "admin-login.html";
        }
    </script>

    <div class="header">
        <h1>Gestion du site</h1>
    </div>

    <div class="container">

        <h2>Modifier le contenu du site</h2>

        <label>Texte de la page d'accueil
            <textarea placeholder="Texte d'accueil actuel..."></textarea>
        </label>

        <label>Texte de la page concept
            <textarea placeholder="Concept actuel..."></textarea>
        </label>

        <label>Texte de la page adhésion
            <textarea placeholder="Texte d'introduction à l'adhésion..."></textarea>
        </label>

        <a class="btn" href="#">Enregistrer les modifications</a>

        <a class="btn" href="admin.html">Retour à l'administration</a>

    </div>

</body>
</html>
