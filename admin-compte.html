<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon compte administrateur – EntreNousTous</title>

    <style>
        body {
            margin: 0;
            font-family: Poppins, Arial, sans-serif;
            background: radial-gradient(circle at top, #ff4da6 0%, #5a00a0 40%, #0a0a0a 80%);
            color: #fff;
        }

        .header {
            text-align: center;
            padding: 40px 0 20px 0;
        }

        .header h1 {
            font-size: 3rem;
            margin: 0;
            text-shadow: 0 0 15px #ff4da6, 0 0 25px #ff7b00;
            letter-spacing: 2px;
        }

        .container {
            max-width: 700px;
            margin: 30px auto;
            background: rgba(10,10,10,0.85);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(255,77,166,0.3);
            text-align: center;
        }

        .info {
            font-size: 1.3rem;
            margin: 15px 0;
        }

        .btn {
            display: inline-block;
            padding: 15px 30px;
            margin-top: 25px;
            background: linear-gradient(90deg, #ff4da6, #ff7b00);
            color: #000;
            font-weight: bold;
            border-radius: 8px;
            text-decoration: none;
            font-size: 1.2rem;
            box-shadow: 0 0 15px rgba(255,77,166,0.5);
        }

        .btn:hover {
            box-shadow: 0 0 25px rgba(255,77,166,0.8);
        }

        .logout {
            background: #444;
            color: #fff;
        }
    </style>
</head>

<body>

    <!-- PROTECTION ADMIN -->
    <script>
        if (localStorage.getItem("admin") !== "true") {
            window.location.href = "admin-login.html";
        }
    </script>

    <div class="header">
        <h1>Mon compte administrateur</h1>
    </div>

    <div class="container">

        <div class="info"><strong>Nom :</strong> Pierre</div>
        <div class="info"><strong>Rôle :</strong> Administrateur principal</div>
        <div class="info"><strong>Accès :</strong> Total (demandes, membres, événements, site)</div>
        <div class="info"><strong>Statut :</strong> Connecté ✔</div>

        <a class="btn" href="admin.html">Accéder au panneau admin</a>

        <br><br>

        <a class="btn logout" href="#" onclick="localStorage.removeItem('admin'); window.location.href='admin-login.html';">
            Se déconnecter
        </a>

    </div>

</body>
</html>
