<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration – EntreNousTous</title>

    <style>
        body {
            margin: 0;
            font-family: Poppins, Arial, sans-serif;
            background: radial-gradient(circle at top, #ff4da6 0%, #5a00a0 40%, #0a0a0a 80%);
            color: #fff;
        }

        .header {
            text-align: center;
            padding: 40px 0 20px 0;
        }

        .header h1 {
            font-size: 3rem;
            margin: 0;
            text-shadow: 0 0 15px #ff4da6, 0 0 25px #ff7b00;
            letter-spacing: 2px;
        }

        .admin-box {
            max-width: 900px;
            margin: 30px auto;
            background: rgba(10,10,10,0.85);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(255,77,166,0.3);
        }

        h2 {
            text-shadow: 0 0 10px #ff7b00;
            margin-bottom: 15px;
        }

        .btn {
            display: block;
            margin: 15px 0;
            padding: 15px;
            background: linear-gradient(90deg, #ff4da6, #ff7b00);
            color: #000;
            font-weight: bold;
            border-radius: 8px;
            text-decoration: none;
            font-size: 1.2rem;
            text-align: center;
            box-shadow: 0 0 15px rgba(255,77,166,0.5);
        }

        .btn:hover {
            box-shadow: 0 0 25px rgba(255,77,166,0.8);
        }

        .logout {
            background: #444;
            color: #fff;
        }
    </style>
</head>

<body>

    <!-- PROTECTION ADMIN -->
    <script>
        if (localStorage.getItem("admin") !== "true") {
            window.location.href = "admin-login.html";
        }
    </script>

    <div class="header">
        <h1>Espace Administrateur</h1>
    </div>

    <div class="admin-box">

        <h2>Gestion des demandes</h2>
        <a class="btn" href="admin-demandes.html">Voir les demandes</a>

        <h2>Gestion des membres</h2>
        <a class="btn" href="admin-membres.html">Liste des membres</a>

        <h2>Gestion des événements</h2>
        <a class="btn" href="admin-evenements.html">Créer / Modifier un événement</a>

        <h2>Gestion du site</h2>
        <a class="btn" href="admin-site.html">Modifier le site</a>

        <h2>Déconnexion</h2>
        <a class="btn logout" href="#" onclick="localStorage.removeItem('admin'); window.location.href='admin-login.html';">
            Se déconnecter
        </a>

    </div>

</body>
</html>
