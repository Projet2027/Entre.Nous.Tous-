<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entre.Nous.Tous – Accueil</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: #fff;
        }

        .hero {
            height: 100vh;
            background: url('hero.jpg') center/cover no-repeat;
            position: relative;
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.55);
        }

        .content {
            position: absolute;
            bottom: 10%;
            left: 10%;
        }

        h1 {
            font-size: 3.5rem;
            margin: 0;
        }

        p {
            font-size: 1.2rem;
            max-width: 400px;
            margin-top: 10px;
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background: #fff;
            color: #000;
            text-decoration: none;
            font-weight: bold;
            border-radius: 4px;
        }
    </style>
</head>

<body>

    <div class="hero">
        <div class="overlay"></div>

        <div class="content">
            <h1>Entre.Nous.Tous</h1>
            <p>Cercle privé, sélectif et confidentiel.  
               Rencontres choisies. Événements exclusifs.</p>

            <a class="btn" href="#">Découvrir</a>
        </div>
    </div>

</body>
</html>
