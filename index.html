<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accueil – EntreNousTous</title>

    <style>
        body {
            margin: 0;
            font-family: Poppins, Arial, sans-serif;
            background: radial-gradient(circle at top, #ff4da6 0%, #5a00a0 40%, #0a0a0a 80%);
            color: #fff;
        }

        /* HEADER */
        .header {
            text-align: center;
            padding: 40px 0 20px 0;
        }

        .header h1 {
            font-size: 3.5rem;
            margin: 0;
            text-shadow: 0 0 15px #ff4da6, 0 0 25px #ff7b00;
            letter-spacing: 2px;
        }

        /* SECTION CENTRALE */
        .center-box {
            max-width: 700px;
            margin: 40px auto;
            background: rgba(10,10,10,0.85);
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 0 25px rgba(255,77,166,0.3);
        }

        .center-box p {
            font-size: 1.3rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            padding: 15px 30px;
            background: linear-gradient(90deg, #ff4da6, #ff7b00);
            color: #000;
            font-weight: bold;
            border-radius: 8px;
            text-decoration: none;
            font-size: 1.2rem;
            box-shadow: 0 0 15px rgba(255,77,166,0.5);
        }

        .btn:hover {
            box-shadow: 0 0 25px rgba(255,77,166,0.8);
        }
    </style>
</head>

<body>

    <!-- TITRE ENTRENOUS TOUS -->
    <div class="header">
        <h1>EntreNousTous</h1>
    </div>

    <!-- CONTENU PRINCIPAL -->
    <div class="center-box">
        <p>
            Cercle privé, sélectif et confidentiel.<br>
            Rencontres choisies. Événements exclusifs.<br>
            Une communauté unique, raffinée et discrète.
        </p>

        <a class="btn" href="concept.html">Découvrir</a>
    </div>

</body>
</html>
