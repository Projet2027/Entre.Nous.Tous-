<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entre.Nous.Tous — Adhésion</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0a0a0a;
            color: #fff;
            padding: 20px;
        }

        h1 {
            text-align: center;
            font-size: 2.8rem;
            color: #ff4da6;
            text-shadow: 0 0 15px #ff4da6;
            margin-bottom: 10px;
        }

        h1 span {
            color: #ff8c42;
            text-shadow: 0 0 15px #ff8c42;
        }

        .intro {
            text-align: center;
            font-size: 1.2rem;
            color: #ffd27f;
            margin-bottom: 40px;
        }

        .section {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .section h2 {
            color: #ff8c42;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #ff8c42;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            color: #ffd27f;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            background: #111;
            border: 1px solid #333;
            border-radius: 5px;
            color: #fff;
        }

        textarea {
            height: 100px;
        }

        .photo-upload {
            margin-top: 15px;
            padding: 15px;
            background: rgba(255,255,255,0.05);
            border: 1px dashed rgba(255,255,255,0.2);
            border-radius: 8px;
            text-align: center;
        }

        .btn {
            display: block;
            width: fit-content;
            margin: 30px auto 0;
            padding: 12px 25px;
            background: #ff4da6;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            box-shadow: 0 0 10px #ff4da6;
            transition: 0.3s;
        }

        .btn:hover {
            box-shadow: 0 0 20px #ff4da6;
        }
    </style>
</head>

<body>

    <h1>Adhésion <span>Privée</span></h1>
    <div class="intro">
        Sélection stricte. Profil vérifié. Confidentialité totale.<br>
        Choisissez votre type d’adhésion.
    </div>

    <div class="section">
        <h2>Type de profil</h2>
        <label for="type">Vous êtes :</label>
        <select id="type" name="type">
            <option value="solo">Solo</option>
            <option value="couple">Couple</option>
        </select>
    </div>

    <div class="section">
        <h2>Informations personnelles</h2>

        <label>Âge</label>
        <input type="number" placeholder="Votre âge">

        <label>Morphologie</label>
        <select>
            <option>Fine</option>
            <option>Sportive</option>
            <option>Normale</option>
            <option>Ronde</option>
        </select>

        <label>Style / personnalité</label>
        <textarea placeholder="Décrivez votre style, votre énergie, votre personnalité..."></textarea>

        <label>Consommation d’alcool</label>
        <select>
            <option>Jamais</option>
            <option>Occasionnel</option>
            <option>Régulier</option>
        </select>

        <label>Limites</label>
        <textarea placeholder="Ce que vous ne souhaitez pas, vos limites, vos règles..."></textarea>

        <label>Préférences</label>
        <textarea placeholder="Ce que vous appréciez, vos envies, vos attentes..."></textarea>
    </div>

    <div class="section">
        <h2>Photo obligatoire</h2>
        <div class="photo-upload">
            Déposez votre photo ici<br><br>
            <input type="file" accept="image/*">
        </div>
    </div>

    <a href="#" class="btn">Envoyer ma demande</a>

</body>
</html>
