<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adhésion – Entre.Nous.Tous</title>

    <style>
        body {
            margin: 0;
            background: #0a0a0a;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        h1 {
            text-align: center;
            margin-top: 30px;
            font-size: 2.5rem;
        }

        .container {
            max-width: 700px;
            margin: 30px auto;
            background: #111;
            padding: 25px;
            border-radius: 10px;
        }

        label {
            display: block;
            margin: 10px 0;
            font-size: 1.1rem;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 6px;
            border: none;
        }

        textarea {
            height: 80px;
        }

        .section {
            margin-top: 25px;
            padding: 15px;
            background: #1a1a1a;
            border-radius: 8px;
        }

        .submit-btn {
            margin-top: 20px;
            padding: 12px 20px;
            background: #ffcc00;
            color: #000;
            font-weight: bold;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>

<body>

    <h1>Adhésion</h1>

    <div class="container">

        <h2>Type de profil</h2>

        <label><input type="radio" name="type" value="femme" onclick="showForm('femme')"> Femme</label>
        <label><input type="radio" name="type" value="homme" onclick="showForm('homme')"> Homme</label>
        <label><input type="radio" name="type" value="couple" onclick="showForm('couple')"> Couple</label>

        <hr>

        <!-- FORMULAIRE FEMME -->
        <div id="form-femme" class="section" style="display:none;">
            <h3>Profil Femme</h3>

            <label>Photo (obligatoire)
                <input type="file" required>
            </label>

            <label>Âge
                <input type="number">
            </label>

            <label>Morphologie
                <input type="text">
            </label>

            <label>Style / personnalité
                <input type="text">
            </label>

            <label>Présentation
                <textarea></textarea>
            </label>

            <label>Limites
                <textarea></textarea>
            </label>

            <label>Préférences
                <textarea></textarea>
            </label>
        </div>

        <!-- FORMULAIRE HOMME -->
        <div id="form-homme" class="section" style="display:none;">
            <h3>Profil Homme</h3>

            <label>Photo (obligatoire)
                <input type="file" required>
            </label>

            <label>Âge
                <input type="number">
            </label>

            <label>Morphologie
                <input type="text">
            </label>

            <label>Style / personnalité
                <input type="text">
            </label>

            <label>Présentation
                <textarea></textarea>
            </label>

            <label>Limites
                <textarea></textarea>
            </label>

            <label>Préférences
                <textarea></textarea>
            </label>
        </div>

        <!-- FORMULAIRE COUPLE -->
        <div id="form-couple" class="section" style="display:none;">
            <h3>Profil Couple</h3>

            <label>Photo du couple (obligatoire)
                <input type="file" required>
            </label>

            <h4>Profil Femme</h4>
            <label>Âge
                <input type="number">
            </label>
            <label>Morphologie
                <input type="text">
            </label>
            <label>Style / personnalité
                <input type="text">
            </label>
            <label>Présentation
                <textarea></textarea>
            </label>

            <h4>Profil Homme</h4>
            <label>Âge
                <input type="number">
            </label>
            <label>Morphologie
                <input type="text">
            </label>
            <label>Style / personnalité
                <input type="text">
            </label>
            <label>Présentation
                <textarea></textarea>
            </label>

            <h4>Limites du couple</h4>
            <textarea></textarea>

            <h4>Préférences du couple</h4>
            <textarea></textarea>
        </div>

        <button class="submit-btn">Envoyer la demande</button>

    </div>

    <script>
        function showForm(type) {
            document.getElementById('form-femme').style.display = 'none';
            document.getElementById('form-homme').style.display = 'none';
            document.getElementById('form-couple').style.display = 'none';

            document.getElementById('form-' + type).style.display = 'block';
        }
    </script>

</body>
</html>
