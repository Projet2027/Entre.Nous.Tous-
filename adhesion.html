<h2>Type de profil</h2>

<label>
    <input type="radio" name="type" value="femme" onclick="showForm('femme')">
    Femme
</label>

<label>
    <input type="radio" name="type" value="homme" onclick="showForm('homme')">
    Homme
</label>

<label>
    <input type="radio" name="type" value="couple" onclick="showForm('couple')">
    Couple
</label>

<hr>

<!-- FORMULAIRE FEMME -->
<div id="form-femme" style="display:none;">
    <h3>Profil Femme</h3>
    <input type="file" required>
    <input type="number" placeholder="Âge">
    <input type="text" placeholder="Morphologie">
    <input type="text" placeholder="Style / personnalité">
    <textarea placeholder="Présentation"></textarea>
    <textarea placeholder="Limites"></textarea>
    <textarea placeholder="Préférences"></textarea>
</div>

<!-- FORMULAIRE HOMME -->
<div id="form-homme" style="display:none;">
    <h3>Profil Homme</h3>
    <input type="file" required>
    <input type="number" placeholder="Âge">
    <input type="text" placeholder="Morphologie">
    <input type="text" placeholder="Style / personnalité">
    <textarea placeholder="Présentation"></textarea>
    <textarea placeholder="Limites"></textarea>
    <textarea placeholder="Préférences"></textarea>
</div>

<!-- FORMULAIRE COUPLE -->
<div id="form-couple" style="display:none;">
    <h3>Profil Couple</h3>
    <input type="file" required>

    <h4>Profil Femme</h4>
    <input type="number" placeholder="Âge">
    <input type="text" placeholder="Morphologie">
    <input type="text" placeholder="Style / personnalité">
    <textarea placeholder="Présentation"></textarea>

    <h4>Profil Homme</h4>
    <input type="number" placeholder="Âge">
    <input type="text" placeholder="Morphologie">
    <input type="text" placeholder="Style / personnalité">
    <textarea placeholder="Présentation"></textarea>

    <h4>Limites du couple</h4>
    <textarea></textarea>

    <h4>Préférences du couple</h4>
    <textarea></textarea>
</div>

<script>
function showForm(type) {
    document.getElementById('form-femme').style.display = 'none';
    document.getElementById('form-homme').style.display = 'none';
    document.getElementById('form-couple').style.display = 'none';

    document.getElementById('form-' + type).style.display = 'block';
}
</script>
