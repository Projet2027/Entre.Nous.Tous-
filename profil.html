<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entre.Nous.Tous — Profil Membre</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0a0a0a;
            color: #fff;
            padding: 20px;
        }

        h1 {
            text-align: center;
            font-size: 2.8rem;
            color: #ff4da6;
            text-shadow: 0 0 15px #ff4da6;
            margin-bottom: 10px;
        }

        h1 span {
            color: #ff8c42;
            text-shadow: 0 0 15px #ff8c42;
        }

        .profile-box {
            max-width: 700px;
            margin: 30px auto;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 25px;
            border-radius: 10px;
        }

        .photo {
            width: 150px;
            height: 150px;
            background: #111;
            border-radius: 10px;
            margin: 0 auto 20px;
            background-size: cover;
            background-position: center;
            border: 2px solid #ff4da6;
            box-shadow: 0 0 15px #ff4da6;
        }

        .info {
            margin-top: 20px;
        }

        .info h2 {
            color: #ff8c42;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #ff8c42;
        }

        .info p {
            margin: 8px 0;
            color: #ffd27f;
        }

        .btn {
            display: block;
            width: fit-content;
            margin: 30px auto 0;
            padding: 12px 25px;
            background: #ff4da6;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            box-shadow: 0 0 10px #ff4da6;
            transition: 0.3s;
        }

        .btn:hover {
            box-shadow: 0 0 20px #ff4da6;
        }
    </style>
</head>

<body>

    <h1>Votre <span>Profil</span></h1>

    <div class="profile-box">

        <div class="photo" style="background-image:url('https://via.placeholder.com/150');"></div>

        <div class="info">
            <h2>Informations personnelles</h2>
            <p><strong>Nom :</strong> Membre validé</p>
            <p><strong>Âge :</strong> 28 ans</p>
            <p><strong>Morphologie :</strong> Sportive</p>
            <p><strong>Style :</strong> Élégant, calme, observateur</p>

            <h2>Préférences</h2>
            <p>Ambiance calme, ateliers, rencontres privées.</p>

            <h2>Limites</h2>
            <p>Respect strict des règles, pas de consommation excessive.</p>
        </div>

        <a href="agenda.html" class="btn">Voir les événements</a>
    </div>

</body>
</html>
